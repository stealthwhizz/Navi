services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      CYBERFORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      CYBERFORGE_SOURCE_ROOT: /workspace
      CYBERFORGE_ALLOWED_TARGET_ORIGIN: ${CYBERFORGE_ALLOWED_TARGET_ORIGIN:?Set CYBERFORGE_ALLOWED_TARGET_ORIGIN in .env}
    volumes:
      - ${CYBERFORGE_SOURCE_PATH:?Set CYBERFORGE_SOURCE_PATH to an existing PHP source directory}:/workspace:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend_environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CYBERFORGE_SOURCE_PATH:?Set CYBERFORGE_SOURCE_PATH to an existing PHP source directory}:/workspace:ro
    ports:
      - "127.0.0.1:${CYBERFORGE_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CYBERFORGE_SOURCE_PATH:?Set CYBERFORGE_SOURCE_PATH to an existing PHP source directory}:/workspace:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
