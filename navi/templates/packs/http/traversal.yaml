id: navi-proof-traversal
info:
  name: Navi traversal proof
  author: Navi
  severity: high
  classification:
    cwe-id: CWE-22
  metadata:
    navi-verifier: traversal
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers:
  - type: word
    words:
    - navi_native_proof_extension_required
