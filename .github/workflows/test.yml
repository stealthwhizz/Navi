name: Native security engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: navi
          POSTGRES_PASSWORD: navi-ci-only
          POSTGRES_DB: navi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navi -d navi"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://navi:navi-ci-only@127.0.0.1:5432/navi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.runtime.lock
      - run: python -m pip install -e '.[test]'
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: UI
      - run: python -m pytest -ra --junitxml=artifacts/test-results.xml
      - run: python scripts/ci_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: artifacts/
