# Navi-authored proof driver; not an upstream Nuclei template.
# The navi-verifier extension selects repeated native verification.
# SPDX-License-Identifier: MIT
id: navi-proof-xss
info:
  name: Navi xss proof
  author: Navi
  severity: high
  classification:
    cwe-id: CWE-79
  metadata:
    navi-verifier: xss
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers:
  - type: word
    words:
    - navi_native_proof_extension_required
