# Navi-authored proof driver; not an upstream Nuclei template.
# The navi-verifier extension selects repeated native verification.
# SPDX-License-Identifier: MIT
id: navi-proof-command
info:
  name: Navi command proof
  author: Navi
  severity: critical
  classification:
    cwe-id: CWE-78
  metadata:
    navi-verifier: command
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers:
  - type: word
    words:
    - navi_native_proof_extension_required
