[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-security"
version = "0.6.0"
description = "Native Flask, PHP and Laravel security analysis, runtime verification and correlated evidence reports"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["security", "sast", "dast", "laravel", "vulnerability-scanner"]
dependencies = ["fastapi==0.135.3", "pydantic==2.14.0", "uvicorn==0.38.0", "psycopg[binary]==3.3.4", "python-dotenv==1.2.1", "PyYAML==6.0.3"]

[project.optional-dependencies]
demo = ["Flask==3.1.3"]
browser = ["playwright==1.63.0"]
test = ["pytest==9.0.3", "Flask==3.1.3", "playwright==1.63.0", "httpx==0.28.1"]

[project.scripts]
navi = "navi.cli:main"

[tool.setuptools.packages.find]
include = ["navi*"]

[tool.setuptools.package-data]
navi = ["web/ui/**/*", "web/ui/*", "schema.sql", "templates/packs/**/*", "templates/packs/*", "integrations/laravel/*.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
